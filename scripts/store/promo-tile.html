<!doctype html>
<!-- Chrome Web Store small promo tile (440x280), rendered by scripts/store-assets.mjs. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --heatmap-color: oklch(50% 0.3 220);
        --level-0: oklch(92% 0 0);
        --level-1: oklch(from var(--heatmap-color) 80% 0.075 h);
        --level-2: oklch(from var(--heatmap-color) 60% 0.2 h);
        --level-3: oklch(from var(--heatmap-color) 20% 0.3 h);
        --level-4: oklch(from var(--heatmap-color) 0% 0.4 h);
        font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: oklch(97% 0.01 220);
        color: oklch(15% 0 0);
      }

      .tile {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 22px;
        height: 100%;
        padding: 28px 30px 26px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand img {
        width: 72px;
        height: 72px;
      }

      h1 {
        font-size: 30px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin-top: 6px;
        font-size: 15px;
        color: oklch(40% 0 0);
      }

      .heatmap {
        display: grid;
        grid-template-rows: repeat(7, 1fr);
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 4px;
      }

      .heatmap span {
        border-radius: 3px;
        background: var(--level-0);
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="brand">
        <img src="%ICON%" alt="" />
        <div>
          <h1>History heatmap</h1>
          <p>Your browsing history, at a glance.</p>
        </div>
      </div>
      <div class="heatmap" aria-hidden="true"></div>
    </div>
    <script>
      // Fixed pattern: busier weekdays, quieter weekends, a few empty days.
      const heatmap = document.querySelector(".heatmap");
      let seed = 7;
      const random = () =>
        ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      for (let week = 0; week < 22; week++) {
        for (let day = 0; day < 7; day++) {
          const weekend = day >= 5;
          const activity = random() * (weekend ? 0.55 : 0.85) + week / 90;
          const level = [0.1, 0.45, 0.75, 0.95].filter(
            (t) => activity >= t,
          ).length;
          const cell = document.createElement("span");
          cell.style.background = `var(--level-${level})`;
          heatmap.append(cell);
        }
      }
    </script>
  </body>
</html>
