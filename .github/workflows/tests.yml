name: Tests and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, America/Los_Angeles, Asia/Tokyo]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build extension
        if: matrix.timezone == 'UTC'
        run: npm run build
